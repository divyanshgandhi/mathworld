<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math World</title>
<style>
@font-face{font-family:"Saira";src:url("fonts/saira-var-latin.woff2") format("woff2");font-weight:100 900;font-stretch:50% 125%;font-display:block}
:root{--void:#07070a;--approach:#e6f1ff;--sky:#8fb4ec;--gold:#ffc857;--ink-2:rgba(230,241,255,.78);--ink-3:rgba(230,241,255,.55);
  --edge:linear-gradient(90deg,#8fb4ec 0%,#4a79bb 38%,#c2473a 72%,#ff3e1f 100%);--edge-hot:linear-gradient(90deg,#ffe2a1,#ffc857 45%,#ff6a3d)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--approach);overflow:hidden}
body{font-family:"Saira",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:var(--void)}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

.title{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,6vw,104px);max-width:760px}
.mark{display:flex;align-items:center;gap:clamp(16px,2vw,28px)}
.mark svg{width:clamp(48px,6vw,84px);height:auto;flex:none}
h1{margin:0;font-weight:200;font-stretch:125%;font-size:clamp(38px,5.2vw,80px);line-height:1;letter-spacing:.14em;white-space:nowrap}
.line{margin:28px 0 0;font-size:clamp(18px,1.6vw,22px);line-height:1.5;color:var(--ink-2);max-width:30ch}
.start{display:inline-flex;align-items:center;gap:22px;align-self:flex-start;margin-top:44px;height:76px;padding:0 16px 0 42px;border-radius:999px;text-decoration:none;color:var(--approach);cursor:pointer;
  background:linear-gradient(var(--void),var(--void)) padding-box,var(--edge) border-box;border:2px solid transparent;
  font-stretch:118%;font-weight:600;font-size:19px;letter-spacing:.2em;text-transform:uppercase;transition:background .35s}
.start svg{width:46px;height:46px;transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.start:hover{background:linear-gradient(#10121c,#10121c) padding-box,var(--edge-hot) border-box}
.start:hover svg{transform:translateY(-4px)}
.who{margin:18px 0 0;font-size:16px;color:var(--ink-3)}
.who b{font-weight:500;color:var(--approach)}

/* one authored moment: the system flies in, then the words arrive */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .9s ease-out,transform 1.1s cubic-bezier(.16,1,.3,1)}
.ready .reveal{opacity:1;transform:none}
.ready .reveal.d1{transition-delay:.15s}.ready .reveal.d2{transition-delay:.35s}.ready .reveal.d3{transition-delay:.55s}

@media (max-width:820px){
  .title{justify-content:flex-end;padding-bottom:10vh;max-width:none}
  h1{font-size:clamp(26px,8.2vw,40px);letter-spacing:.08em}
  .mark svg{width:40px}
  .start{align-self:stretch;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){.reveal{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<main class="title">
  <div class="mark reveal">
    <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="#e6f1ff" stroke-width=".9"/><circle cx="17" cy="17" r="7.5" fill="none" stroke="#ffc857" stroke-width=".9"/><circle cx="29.8" cy="8.6" r="1.7" fill="#e6f1ff"/></svg>
    <h1>MATH WORLD</h1>
  </div>
  <p class="line reveal d1">Answer with your shots. Clear the planets, one times table at a time.</p>
  <a class="start reveal d2" href="#">Start game
    <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="none" stroke="#ffc857" stroke-width="1.3" stroke-dasharray="2 3.4"/><path d="M22 10c4.5 3.6 6.4 9 5.4 15.5h-10.8C15.6 19 17.5 13.6 22 10z" fill="#e6f1ff"/><circle cx="22" cy="18.5" r="2.2" fill="#07070a"/><path d="M18.5 25.5l-3 4.5M25.5 25.5l3 4.5" stroke="#e6f1ff" stroke-width="1.6" stroke-linecap="round"/><path d="M22 27v6" stroke="#ff6a3d" stroke-width="2" stroke-linecap="round"/></svg>
  </a>
  <p class="who reveal d3">Welcome back, Cadet <b>Kit</b></p>
</main>

<script type="module">
import * as THREE from 'three';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07070a);
const camera = new THREE.PerspectiveCamera(36, 1, .1, 2000);

// the light story: gold from the Sun, a faint cool fill on every dark side
scene.add(new THREE.PointLight(0xffd79a, 2600, 0, 1.6));
scene.add(new THREE.HemisphereLight(0x2a3d66, 0x07070a, .55));
const rim = new THREE.DirectionalLight(0x8fb4ec, .9); rim.position.set(-40, 20, -60); scene.add(rim);

// the Sun: a gold body with a soft sprite halo (the only glow in the scene)
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, 'rgba(255,230,170,1)'); r.addColorStop(.18, 'rgba(255,200,87,.55)'); r.addColorStop(.45, 'rgba(255,140,60,.12)'); r.addColorStop(1, 'rgba(255,120,40,0)'); g.fillStyle = r; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const sun = new THREE.Mesh(new THREE.SphereGeometry(4.2, 64, 32), new THREE.MeshBasicMaterial({ color: 0xffd27a }));
scene.add(sun);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
halo.scale.setScalar(34); scene.add(halo);

// planets: matte bodies, real-ish colours, dashed hairline orbits
const PL = [
  ['mercury', 9, .55, 0x9d958c, .9], ['venus', 13, .95, 0xd9c08f, .7], ['earth', 18, 1.05, 0x3f7fd0, .55], ['mars', 23, .75, 0xc4623d, .45],
  ['jupiter', 33, 2.7, 0xcfa77e, .24], ['saturn', 43, 2.2, 0xd8c48f, .18], ['uranus', 52, 1.5, 0x9fd8e0, .13],
];
const planets = [];
for (const [id, R, r, col, w] of PL) {
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: .88, metalness: 0 });
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 24), mat); scene.add(m);
  const pts = []; for (let i = 0; i <= 256; i++) { const a = i / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R)); }
  const og = new THREE.BufferGeometry().setFromPoints(pts);
  const orbit = new THREE.Line(og, new THREE.LineDashedMaterial({ color: 0xe6f1ff, transparent: true, opacity: id === 'earth' ? .42 : .16, dashSize: .35, gapSize: .7 }));
  orbit.computeLineDistances(); scene.add(orbit);
  if (id === 'saturn') { const ring = new THREE.Mesh(new THREE.RingGeometry(r * 1.4, r * 2.2, 96), new THREE.MeshStandardMaterial({ color: 0xcdb98a, roughness: 1, side: THREE.DoubleSide, transparent: true, opacity: .55 })); ring.rotation.x = -Math.PI / 2.4; m.add(ring); }
  planets.push({ id, m, R, w, a: (id.length * 1.7) % (Math.PI * 2) });
}
// home: Earth carries the Moon and the cadet's rocket on a small dashed orbit
const earth = planets.find((p) => p.id === 'earth');
const moon = new THREE.Mesh(new THREE.SphereGeometry(.32, 32, 16), new THREE.MeshStandardMaterial({ color: 0xcfc8bd, roughness: .95 })); scene.add(moon);
const rocket = new THREE.Mesh(new THREE.SphereGeometry(.12, 12, 8), new THREE.MeshBasicMaterial({ color: 0xe6f1ff })); scene.add(rocket);
const trail = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff6a3d })); scene.add(trail);

// stars: a fixed far shell, pin-sharp
const sg = new THREE.BufferGeometry(), sp = [];
for (let i = 0; i < 2200; i++) { const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, rr = 600 + Math.random() * 300; sp.push(Math.sqrt(1 - u * u) * Math.cos(t) * rr, u * rr, Math.sqrt(1 - u * u) * Math.sin(t) * rr); }
sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xe6f1ff, size: 1.4, sizeAttenuation: false, transparent: true, opacity: .7 })));

// camera: fly in from deep space, settle high and to the left so the system sits right of the words
const from = new THREE.Vector3(-20, 30, 170), look = new THREE.Vector3();
function settle(T) {
  const wide = innerWidth > 820, k = RM ? 1 : 1 - Math.pow(1 - Math.min(1, T / 5.5), 4);
  const orbit = .55 + (RM ? 0 : T * .018);
  const end = wide ? new THREE.Vector3(Math.cos(orbit) * 50, 17, Math.sin(orbit) * 50) : new THREE.Vector3(Math.cos(orbit) * 58, 30, Math.sin(orbit) * 58);
  camera.position.lerpVectors(from, end, k);
  look.set(0, 0, 0);
  camera.lookAt(look);
  return k;
}
function size() {
  const w = innerWidth, h = innerHeight, wide = w > 820;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = wide ? 38 : 60;
  // shift the frame, not the scene: the Sun lands right of the words on desktop, above them on phones
  if (wide) camera.setViewOffset(w, h, -w * .3, 0, w, h); else camera.setViewOffset(w, h, 0, h * .2, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', size); size();

let T = 0, last = performance.now(), t0 = performance.now(), shown = false;
setTimeout(() => document.body.classList.add('ready'), 4200);
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T = (now - t0) / 1000;
  for (const p of planets) { if (!RM) p.a += p.w * dt * .35; p.m.position.set(Math.cos(p.a) * p.R, 0, Math.sin(p.a) * p.R); p.m.rotation.y += dt * .2; }
  const e = earth.m.position, mt = T * .9, rt = T * 1.6;
  moon.position.set(e.x + Math.cos(mt) * 2.2, .25, e.z + Math.sin(mt) * 2.2);
  rocket.position.set(e.x + Math.cos(rt) * 3.1, .9 * Math.sin(rt), e.z + Math.sin(rt) * 3.1);
  trail.position.set(e.x + Math.cos(rt - .14) * 3.1, .9 * Math.sin(rt - .14), e.z + Math.sin(rt - .14) * 3.1);
  const k = settle(T);
  if (!shown && k > .82) { shown = true; document.body.classList.add('ready'); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
