const chime=()=>snd(a=>{const t=a.currentTime;[[659,0],[880,0.18],[1319,0.36]].forEach(([fr,dl])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=fr;g.gain.setValueAtTime(0.0001,t+dl);g.gain.exponentialRampToValueAtTime(0.1,t+dl+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dl+1.4);o.connect(g).connect(a.destination);o.start(t+dl);o.stop(t+dl+1.5)})});
const yawn=()=>snd(a=>{const t=a.currentTime,g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.35);g.gain.linearRampToValueAtTime(0.15,t+1.3);g.gain.exponentialRampToValueAtTime(0.0001,t+2.0);g.connect(a.destination);
const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(240,t);o.frequency.linearRampToValueAtTime(310,t+0.45);o.frequency.exponentialRampToValueAtTime(130,t+1.9);
[[750,1100,450],[1150,1500,800]].forEach(([f0,f1,f2])=>{const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=5;f.frequency.setValueAtTime(f0,t);f.frequency.linearRampToValueAtTime(f1,t+0.5);f.frequency.exponentialRampToValueAtTime(f2,t+1.9);o.connect(f).connect(g)});
const n=a.createBufferSource();n.buffer=noiseBuf(a,2.1);const nf=a.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1200;nf.Q.value=0.8;const ng=a.createGain();ng.gain.value=0.25;n.connect(nf).connect(ng).connect(g);o.start(t);o.stop(t+2.05);n.start(t);n.stop(t+2.05)});
const knock=()=>snd(a=>{const t=a.currentTime;[0,0.2,0.62,0.82].forEach(dl=>{const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(140,t+dl);o.frequency.exponentialRampToValueAtTime(70,t+dl+0.12);g.gain.setValueAtTime(0.0001,t+dl);g.gain.exponentialRampToValueAtTime(0.5,t+dl+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dl+0.16);o.connect(g).connect(a.destination);o.start(t+dl);o.stop(t+dl+0.2);
const n=a.createBufferSource();n.buffer=noiseBuf(a,0.1);const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const ng=a.createGain();ng.gain.setValueAtTime(0.25,t+dl);ng.gain.exponentialRampToValueAtTime(0.0001,t+dl+0.07);n.connect(f).connect(ng).connect(a.destination);n.start(t+dl)})});
const blip=(hi)=>snd(a=>{const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(hi?880:440,t);o.frequency.exponentialRampToValueAtTime(hi?1320:330,t+0.12);g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.22)});
// ---------- overlays ----------
let lidO=1,blurPx=0,fadeO=0;
function caption(n,s){capEl.innerHTML=s?(n?`<b>${n}</b>`:'')+s:'';capEl.style.opacity=s?1:0}
function title(a,b,big=true){$('t1').textContent=a;$('t2').textContent=b||'';$('t1').style.fontSize=big?'64px':'30px';$('t1').style.letterSpacing=big?'.32em':'.04em';$('t1').style.paddingLeft=big?'.32em':'0';$('t1').style.fontStyle=big?'normal':'italic';titleEl.style.opacity=1}
const titleOut=()=>titleEl.style.opacity=0;
function overlays(){lidT.style.transform=`translateY(${-lidO*100}%)`;lidB.style.transform=`translateY(${lidO*100}%)`;renderer.domElement.style.filter=blurPx>0.05?`blur(${blurPx}px)`:'none';fadeEl.style.opacity=fadeO}
// ---------- phases & moods ----------
let phase='',mood='tuesday',fp=false;
function setPhase(p){phase=p;const sp=p==='space',tw=p==='town',cs=p==='class';
scene.background=new THREE.Color(sp?0x000000:tw?0xa9d3f5:0x2a2440);scene.fog=tw?new THREE.Fog(0xa9d3f5,140,520):null;
camera.far=sp?3000:tw?700:60;camera.near=sp?0.5:0.05;camera.updateProjectionMatrix();
hemi.color.set(sp?0x223355:tw?0xcfe6ff:0xdfe6f0);hemi.groundColor.set(sp?0x000000:tw?0x6a8a5a:0x6b5a4a);hemi.intensity=sp?0.25:tw?1.0:0.8;
spaceSun.intensity=sp?3.0:0;townSun.intensity=tw?2.7:0;key.intensity=cs?1.8:0;tube.intensity=cs?22:0;
const M=cs?MOOD[mood]:{sat:1,tint:[1,1,1],exp:1.0};grade.uniforms.sat.value=M.sat;grade.uniforms.tint.value.set(...M.tint);renderer.toneMappingExposure=M.exp}
const MOOD={tuesday:{sat:0.58,tint:[1.03,1.0,0.95],exp:0.95,hall:0.2,spot:0},knock:{sat:0.82,tint:[1.04,1.0,0.95],exp:1.0,hall:0.85,spot:16}};
// ---------- camera ----------
const cam={p:new THREE.Vector3(),l:new THREE.Vector3(),tp:new THREE.Vector3(),tl:new THREE.Vector3(),k:0};
function shot(p,l,k=2.5){cam.tp.set(...p);cam.tl.set(...l);cam.k=k;if(!k){cam.p.copy(cam.tp);cam.l.copy(cam.tl)}}
const VIEW={back:[[-1.5,2.3,3.9],[0.8,1.1,-4]],door:[[1.5,1.8,-2.1],[5.6,1.25,-3.6]],captain:[[2.4,1.75,-4.65],[4.8,1.55,-4.0]],onPlayer:[[1.1,1.55,-0.5],[0,1.15,1.1]]};
const view=(v,k)=>shot(...VIEW[v],k);
function fpEye(){const h=headPos(C.player),H=CS[styleKey].kid.H;return h.add(new THREE.Vector3(0,H*1.0,-H*0.85))}
// ---------- the film ----------
const ease=k=>k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lidKeys=[[0,0],[0.5,0],[1.1,0.32],[1.5,0.08],[2.1,0.55],[2.4,0.25],[3.0,1]];
const lidAt=t=>{for(let i=1;i<lidKeys.length;i++){const[a,va]=lidKeys[i-1],[b,vb]=lidKeys[i];if(t<=b)return va+(vb-va)*ease(clamp((t-a)/(b-a)))}return 1};
function choiceStep(q,opts,right,word,kid){let res=null,at=0,phase2=0;const obj={phase:'class',enter(){caption('Teacher',"Who's going to tell me?");C.teacher.userData.talking=true;
choicesEl.innerHTML='';opts.forEach(v=>{const b=document.createElement('button');b.className='ch';b.textContent=v;b.onclick=()=>pick(v);choicesEl.appendChild(b)});choicesEl.style.display='flex';barW.style.opacity=1;res=null;phase2=0},
update(t){if(!res){barEl.style.width=clamp(1-t/5)*100+'%';if(t>1.6)C.teacher.userData.talking=false;if(t>=5)resolve('none',null,t)}
else if(phase2===0&&t-at>1.7){phase2=1;people().forEach(g=>{g.userData.raise=false;g.userData.talking=false});C.teacher.userData.talking=true;
caption('Teacher',res==='wrong'?`Ooh, close. It's ${right}.`:`${word}. Lovely!`)}},
done:t=>res&&t-at>4.0};obj.pick=pick;obj.opts=opts;return obj;
function pick(v){if(res||si<0||steps[si].pick!==pick)return;resolve(v===right?'right':'wrong',v)}
function resolve(r,v,t){res=r;at=t??st;choicesEl.style.display='none';barW.style.opacity=0;C.teacher.userData.talking=false;const who=r==='none'?C.kids[kid]:C.player;who.userData.raise=true;who.userData.talking=true;
blip(r==='right');caption(r==='none'?'Classmate':'You',`${r==='none'?right:v}!`)}}
const NAMES=[['Maya',0],['Leo',2],['Aarav',5],['Zoe',6]];
const steps=[
{phase:'space',d:3.4,enter(){shot([SP.x,SP.y+8,SP.z+150],[SP.x,SP.y,SP.z],0);title('EARTH','an ordinary planet');fadeO=0},update(t){cam.p.set(SP.x+t*3,SP.y+8-t*0.6,SP.z+150-t*4)}},
{phase:'space',d:3.2,enter(){titleOut();whoosh()},update(t){const k=t/3.2,e=Math.pow(k,2.4),d=136-e*(136-ER-2);cam.p.set(SP.x+10*(1-e),SP.y+8*(1-e)+4*e,SP.z+d);cam.l.set(SP.x,SP.y+2*e,SP.z);fadeEl.style.background='#fff';fadeO=clamp((k-0.72)/0.25)}},
{phase:'town',d:4.6,enter(){fadeEl.style.background='#fff'},update(t){fadeO=clamp(1-t/0.9);const k=ease(clamp(t/4.6));cam.p.set(TX+40-34*k,70-63.5*k,90-66*k);cam.l.set(TX,4*k,0)}},
{phase:'town',d:3.2,enter(){title('An ordinary Tuesday…','',false);chime()},update(t){cam.p.set(TX+6-t*0.25,6.5-t*0.1,24-t*0.5);cam.l.set(TX,4.2,0)}},
{phase:'town',d:1.0,enter(){titleOut();fadeEl.style.background='#000'},update(t){fadeO=clamp(t/0.9);cam.p.z-=0.01}},
{phase:'class',fp:true,d:3.0,enter(){fadeO=0;lidO=0;blurPx=7;boardText('4 + 4 = ?');lookAt('teacher');const e=fpEye();shot([e.x,e.y,e.z],[e.x,0.55,e.z-0.9],0)},
update(t){lidO=lidAt(t);blurPx=7*(1-clamp((t-0.6)/2.4));const e=fpEye();cam.p.copy(e);cam.l.set(e.x+Math.sin(t*0.8)*0.1,0.55+t*0.12,e.z-0.9)}},
{phase:'class',fp:true,d:2.7,enter(){lidO=1;blurPx=0;yawn();hand.visible=true},update(t){const up=t<0.7?ease(t/0.7):t<1.9?1:1-ease(clamp((t-1.9)/0.7));
hand.position.set(0.12-0.1*up,-0.48+0.37*up,-0.36+0.06*up);hand.rotation.set(0.3*up,0,-0.4+0.3*up);const e=fpEye();cam.p.copy(e);cam.l.set(e.x,0.95+0.5*up,e.z-0.9);if(t>2.6)hand.visible=false}},
{phase:'class',fp:true,d:4.4,enter(){hand.visible=false;caption('Teacher','Class, you have learned addition and subtraction. As we all know, 4 + 4 is…');C.teacher.userData.talking=true;shot([...fpEye().toArray()],[-1.7,1.55,-4],1.8)},
update(t){if(t>1.6&&fp){fp=false;view('back',1.1)}}},
choiceStep('4 + 4',[8,9],8,'Eight',1),
{phase:'class',d:2.6,enter(){boardText('5 − 3 = ?');caption('Teacher',"And what's 5 − 3?");C.teacher.userData.talking=true}},
choiceStep('5 − 3',[3,2],2,'Two',3),
{phase:'class',d:3.4,enter(){boardText('×');caption('Teacher',"Okay class, today we're starting multiplication…");C.teacher.userData.talking=true}},
{phase:'class',d:1.9,enter(){caption('','<i>knock knock</i>');knock();lookAt('door');view('door',0)}},
{phase:'class',d:2.8,enter(){caption('','');mood='knock';doorTarget=1.35;for(const n of['principal','captain']){const g=C[n];g.visible=true;g.position.copy(HALL_P[0]);g.userData.walk={pts:[HALL_P[0],HALL_P[1],TGT[n]],t0:T+(n==='captain'?0.5:0),d:2.0}}}},
{phase:'class',d:2.3,enter(){caption('Principal','Sorry to interrupt.');C.principal.userData.talking=true}},
{phase:'class',d:4.4,enter(){caption('Captain','There is grave danger in space. We are enrolling five of your brightest students as cadets.');C.captain.userData.talking=true;view('captain',1.6);lookAt('captain')}},
{phase:'class',d:4.2,enter(){C.teacher.userData.talking=true;view('back',1.4);lookAt('teacher')},update(t){const n=NAMES.filter((_,i)=>t>0.3+i*0.9);caption('Teacher',n.map(x=>x[0]).join('… ')+'…');n.forEach(([,i])=>C.kids[i].userData.stand=1)}},
{phase:'class',d:3.4,enter(){caption('Teacher','…and you!');C.teacher.userData.talking=true;lookAt('player');view('onPlayer',1.3)},update(t){if(t>0.5)C.player.userData.stand=1}},
{phase:'class',d:3.5,enter(){caption('','');fadeEl.style.background='#0d0e1a'},update(t){fadeO=clamp(t/1.2);if(t>1.2&&titleEl.style.opacity!=='1')title('CADET SELECTED','next: the Starfleet hangar')}}];
let si=-1,st=0,T=0,doorTarget=0,flick=0;
function go(i){si=i;st=0;people().forEach(g=>g.userData.talking=false);const s=steps[i];if(!s){playBtn.textContent='↻ Replay';playBtn.style.display='';return}
if(s.phase!==phase)setPhase(s.phase);fp=!!s.fp;s.enter&&s.enter()}
function reset(){people().forEach(g=>{const u=g.userData;u.raise=false;u.talking=false;u.walk=null;if(u.seatY!==undefined){u.stand=0;u.s=0}});
for(const n of['principal','captain']){C[n].visible=false;C[n].position.copy(HALL_P[0])}mood='tuesday';doorTarget=0;door.rotation.y=0;
titleOut();caption('','');choicesEl.style.display='none';barW.style.opacity=0;hand.visible=false;lidO=1;blurPx=0;fadeO=0;fp=false;boardText('4 + 4 = ?')}
function jump(i){reset();if(i>=12){setPhase('class');boardText('×');view('back',0);lookAt('teacher')}go(i)}
function update(dt){T+=dt;if(si>=0&&si<steps.length){st+=dt;const s=steps[si];s.update&&s.update(st,dt);if((s.d!==undefined&&st>=s.d)||(s.done&&s.done(st)))go(si+1)}
const lerp=(a,b,k)=>a+(b-a)*Math.min(1,dt*k);
if(phase==='class'){const M=MOOD[mood];grade.uniforms.sat.value=lerp(grade.uniforms.sat.value,M.sat,1.5);const tn=grade.uniforms.tint.value;tn.set(lerp(tn.x,M.tint[0],1.5),lerp(tn.y,M.tint[1],1.5),lerp(tn.z,M.tint[2],1.5));renderer.toneMappingExposure=lerp(renderer.toneMappingExposure,M.exp,1.5);
hallM.emissiveIntensity=lerp(hallM.emissiveIntensity,M.hall*(door.rotation.y>0.3?1:0.25),2);spot.intensity=lerp(spot.intensity,M.spot*(door.rotation.y>0.3?1:0),2);fill.intensity=lerp(fill.intensity,mood==='knock'?5:0,2);
if(mood==='tuesday'){if(flick<=0&&rnd()<0.005)flick=0.35}if(flick>0){flick-=dt;const on=rnd()>0.5;tubeM.emissiveIntensity=on?2.2:0.3;tube.intensity=on?22:4}else{tubeM.emissiveIntensity=2.2;tube.intensity=22}
door.rotation.y+=(doorTarget-door.rotation.y)*Math.min(1,dt*2.5);minH.rotation.z=-T*0.2;hourH.rotation.z=-T*0.017;dust.position.y=Math.sin(T*0.25)*0.12;dust.rotation.y=T*0.012;
people().forEach(g=>animChar(g,dt));C.player.userData.head.visible=!(fp&&cam.p.distanceTo(fpEye())<0.6)}
if(phase==='space'){earth.rotation.y+=dt*0.05;clouds.rotation.y+=dt*0.065}
if(phase==='town')flag.rotation.y=Math.sin(T*3)*0.15;
if(cam.k>0){const f=1-Math.exp(-dt*cam.k);cam.p.lerp(cam.tp,f);cam.l.lerp(cam.tl,f)}
const sway=phase==='class'&&!fp?1:0;camera.position.set(cam.p.x+Math.sin(T*0.3)*0.04*sway,cam.p.y+Math.sin(T*0.45)*0.025*sway,cam.p.z);camera.lookAt(cam.l);overlays()}
const clk=new THREE.Clock();function tick(){update(Math.min(clk.getDelta(),0.05));composer.render();requestAnimationFrame(tick)}
const mk=(el,list,attr,fn)=>list.forEach(([k,n,d])=>{const b=document.createElement('button');b.className='sb';b.dataset[attr]=k;b.innerHTML=d?`${n}<small>${d}</small>`:n;b.onclick=()=>fn(k);$(el).appendChild(b)});
mk('styles',[['story','Storybook','chosen'],['bean','Clay bean'],['toy','Big-eye toy']],'s',k=>{const i=Math.max(0,si);build(k);jump(i>=12?12:i>=5?5:0);playBtn.style.display='none';ac()});
mk('chapters',[[0,'Earth'],[5,'Classroom'],[12,'The knock']],'c',i=>{playBtn.style.display='none';ac();jump(+i)});
document.addEventListener('keydown',e=>{const s=steps[si];if(s&&s.pick&&s.opts){const ix=e.key==='1'?0:e.key==='2'?1:s.opts.indexOf(+e.key);if(ix>=0&&ix<s.opts.length){e.preventDefault();s.pick(s.opts[ix])}}});
playBtn.onclick=()=>{playBtn.style.display='none';ac();jump(0)};
build('story');reset();setPhase('space');shot([SP.x,SP.y+8,SP.z+150],[SP.x,SP.y,SP.z],0);tick();
window.__ok=1;window.__step=sec=>{for(let i=0;i<sec*60;i++)update(1/60);composer.render()};window.__api={jump,steps:()=>si,pick:v=>steps[si]&&steps[si].pick&&steps[si].pick(v)};
</script>
