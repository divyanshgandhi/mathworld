if(hs==='curly')for(let k=0;k<12;k++){const th=(k%6)/6*Math.PI*2+(k<6?0:0.5),ph=k<6?0.55:1.05,x=Math.sin(ph)*Math.cos(th),z=Math.sin(ph)*Math.sin(th);if(k>=6&&z>0.5)continue;add(head,new THREE.SphereGeometry(H*0.36,12,10),hair,x*H,hy+Math.cos(ph)*H,z*H)}
if(hs==='long')add(head,new THREE.CapsuleGeometry(H*0.78,H*0.9,8,16),hair,0,hy-H*0.45,-H*0.32);
if(hs==='bald')for(const s of[-1,1])add(head,new THREE.SphereGeometry(H*0.3,12,10),hair,s*H*0.88,hy-H*0.05,-H*0.25);
const ex_=sp.ex||[];
if(ex_.includes('glasses')){for(const s of[-1,1])add(head,new THREE.TorusGeometry(H*0.2,H*0.03,8,20),dark,s*ex,hy+ey,surf(ex,ey)+H*(st.eye==='big'?0.12:0.03),{cast:false});add(head,new THREE.BoxGeometry(H*0.32,H*0.04,H*0.04),dark,0,hy+ey,surf(0,ey)+H*0.04,{cast:false})}
if(ex_.includes('mustache'))add(head,new THREE.TorusGeometry(H*0.16,H*0.06,8,16,Math.PI),hair,0,hy-H*0.2,surf(0,-H*0.2)*1.0,{cast:false});
if(ex_.includes('tie'))add(g,new THREE.BoxGeometry(R*0.25,Ht*0.55,0.03),mat(0xd94a4a),0,L+Ht*0.55,R*(taper?1.0:1.02));
if(ex_.includes('cap')){const cm=mat(0x23305a);add(head,new THREE.CylinderGeometry(H*1.0,H*1.05,H*0.42,24),cm,0,hy+H*0.78,-H*0.02);add(head,new THREE.CylinderGeometry(H*0.75,H*0.75,H*0.05,24,1,false,-Math.PI/2,Math.PI),dark,0,hy+H*0.58,H*0.35);add(head,new THREE.SphereGeometry(H*0.12,12,8),gold,0,hy+H*0.82,H*1.03)}
if(ex_.includes('epaulettes'))for(const s of[-1,1])add(g,new THREE.BoxGeometry(R*0.6,0.04,R*0.6),gold,s*R*0.95,L+Ht-R*0.05,0);
if(ex_.includes('badge'))add(g,new THREE.BoxGeometry(R*0.3,R*0.3,0.03),gold,-R*0.45,L+Ht*0.7,R*0.97);
g.userData={arms,legs,head,mouth,eyes,torso,blink:rnd()*3,ph:rnd()*6,r:0,raise:false,talking:false,look:null,baseArmX:0};return g}
function makeNova(){const g=new THREE.Group();add(g,new THREE.SphereGeometry(0.32,32,20),mat(0xf3eee6,{roughness:0.45}),0,0,0);
const f=add(g,new THREE.SphereGeometry(0.24,24,16),mat(0x10153a,{roughness:0.25}),0,0.02,0.16,{cast:false});f.scale.set(1,0.75,0.55);
const em=c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:3});
for(const s of[-1,1])add(g,new THREE.CapsuleGeometry(0.028,0.04,4,8),em(0x3dfcff),s*0.08,0.06,0.29,{cast:false});
const sm=add(g,new THREE.TorusGeometry(0.06,0.014,6,16,Math.PI),em(0x3dfcff),0,-0.04,0.29,{cast:false});sm.rotation.z=Math.PI;
const ring=add(g,new THREE.TorusGeometry(0.46,0.018,8,64),em(0x7ddc3e),0,0,0,{cast:false});ring.rotation.x=Math.PI/2.3;
add(g,new THREE.CylinderGeometry(0.012,0.012,0.2,6),dark,0,0.38,0);add(g,new THREE.SphereGeometry(0.04,10,8),em(0x7ddc3e),0,0.5,0,{cast:false});
for(const s of[-1,1])add(g,new THREE.SphereGeometry(0.07,12,8),mat(0x7ddc3e),s*0.31,0.02,0);
g.userData={nova:true,ring};return g}
let C={kids:[],cast:[]},styleKey='bean';
const DOOR=new THREE.Vector3(6,1.3,-3.5),CLASS=new THREE.Vector3(0,1,1.2);
function face(g,t){g.rotation.y=Math.atan2(t.x-g.position.x,t.z-g.position.z)}
function build(k){styleKey=k;[...C.kids,...C.cast,C.player,C.teacher,C.principal,C.captain].forEach(g=>g&&scene.remove(g));const st=CS[k];C={kids:[],cast:[]};let j=0;
seats.forEach(([x,z],i)=>{const g=makeChar(i===4?PLAYER:KIDS[j++],st);g.position.set(x,0.47-st.kid.L,z+0.5);g.rotation.y=Math.PI;const u=g.userData;u.legs.forEach(l=>l.rotation.x=-Math.PI/2);u.baseArmX=-0.8;scene.add(g);if(i===4)C.player=g;else C.kids.push(g)});
C.teacher=makeChar(TEACHER,st);C.teacher.position.set(-1.7,0,-4.0);scene.add(C.teacher);
C.principal=makeChar(PRINCIPAL,st);C.principal.position.set(4.7,0,-3.0);face(C.principal,CLASS);scene.add(C.principal);
C.captain=makeChar(CAPTAIN,st);C.captain.position.set(4.95,0,-4.0);face(C.captain,CLASS);scene.add(C.captain);
[TEACHER,PRINCIPAL,CAPTAIN,KIDS[0],KIDS[1],PLAYER].forEach((sp,i)=>{const g=makeChar(sp,st);g.position.set(40+(i-3)*1.2,0,0);scene.add(g);C.cast.push(g)});
const n=makeNova();n.position.set(40+3*1.2,1.3,0);scene.add(n);C.cast.push(n);
C.cast.forEach(g=>{g.userData.top=new THREE.Box3().setFromObject(g).max.y});
document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===k));setMoment(moment)}
// post
const Grade={uniforms:{tDiffuse:{value:null},sat:{value:0.6},tint:{value:new THREE.Vector3(1,1,1)},vig:{value:0.3}},
vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
fragmentShader:'uniform sampler2D tDiffuse;uniform float sat;uniform vec3 tint;uniform float vig;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(0.2126,0.7152,0.0722));vec3 col=mix(vec3(l),c.rgb,sat)*tint;float d=distance(vUv,vec2(0.5));col*=1.0-vig*smoothstep(0.35,0.85,d);gl_FragColor=vec4(col,c.a);}'};
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(512,512),0.55,0.5,1.0);composer.addPass(bloom);composer.addPass(new OutputPass());const grade=new ShaderPass(Grade);composer.addPass(grade);
function size(){const w=wrap.clientWidth||680,h=Math.round(w*0.58);renderer.setSize(w,h);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(size).observe(wrap);size();
// moments, script, views
const MOM={tuesday:{sat:0.58,tint:[1.03,1.0,0.95],hall:0.25,spot:0,win:1.1,exp:0.95},knock:{sat:1.08,tint:[1.05,1.0,0.93],hall:3.4,spot:90,win:1.3,exp:1.05}};
const SCRIPT={tuesday:[
{who:'teacher',n:'Teacher',t:3.6,say:'Class, you have learned addition and subtraction. As we all know, 4 + 4 is…',board:'4 + 4 = ?',look:'teacher',door:0},
{who:'teacher',n:'Teacher',t:2.0,say:"Who's going to tell me?"},
{wait:5,ans:'Eight!',kid:1},
{who:'teacher',n:'Teacher',t:2.2,say:'Eight. Lovely.',board:'4 + 4 = 8'},
{who:'teacher',n:'Teacher',t:2.4,say:"And what's 5 − 3?",board:'5 − 3 = ?'},
{wait:5,ans:'Two!',kid:3},
{who:'teacher',n:'Teacher',t:3.2,say:"Two. Okay class, today we're starting multiplication…",board:'5 − 3 = 2'}],
knock:[
{t:1.8,say:'<i>knock knock</i>',door:-1.35,look:'door',board:'×'},
{who:'principal',n:'Principal',t:2.2,say:'Sorry to interrupt.'},
{who:'captain',n:'Captain',t:3.8,say:'There is grave danger in space. We are enrolling five of your brightest students as cadets.'},
{who:'teacher',n:'Teacher',t:3.2,say:'Maya… Leo… Aarav… Zoe…',look:'teacher'},
{who:'teacher',n:'Teacher',t:2.6,say:'…and you!',look:'player'},
{t:2.2,say:'',door:0}]};
const VIEWS={back:{p:[-1.5,2.3,3.9],l:[0.8,1.1,-4]},teacher:{p:[-0.5,1.95,-4.35],l:[0.3,0.85,2.5]},door:{p:[1.5,1.8,-2.1],l:[5.6,1.25,-3.6]},cast:{p:[40,1.3,5.8],l:[40,0.85,0]}};
let moment='tuesday',view='back',si=0,stT=0,waitS=null,doorTarget=0,flick=0,T=0;
const camPos=new THREE.Vector3(...VIEWS.back.p),camLook=new THREE.Vector3(...VIEWS.back.l);
function allPeople(){return[...C.kids,C.player,C.teacher,C.principal,C.captain]}
function headPos(g){return g.userData.head.getWorldPosition(new THREE.Vector3())}
function lookAt(k){const tp=k==='door'?DOOR:k==='player'?headPos(C.player):headPos(C.teacher);[...C.kids,C.player].forEach(g=>g.userData.look=tp);
C.player.userData.look=k==='player'?headPos(C.teacher):tp;C.teacher.userData.look=k==='teacher'?CLASS:tp;C.principal.userData.look=CLASS;C.captain.userData.look=CLASS}
function startStep(){const s=SCRIPT[moment][si];stT=0;allPeople().forEach(g=>g.userData.talking=false);
if(s.board)boardText(s.board);if(s.door!==undefined)doorTarget=s.door;if(s.look)lookAt(s.look);
if(s.wait){waitS={t:s.wait,pressed:false,answered:false,ans:s.ans,kid:s.kid};capEl.innerHTML='<b>Raise your hand</b> Space or tap ✋';handBtn.disabled=false;handBtn.style.opacity=1}
else{waitS=null;handBtn.disabled=true;handBtn.style.opacity=0.35;barEl.style.width='0';if(s.who)C[s.who].userData.talking=true;capEl.innerHTML=s.say?(s.n?`<b>${s.n}</b>`:'')+s.say:'';capEl.style.opacity=s.say?1:0}
if(s.wait)capEl.style.opacity=1}
function next(){si=(si+1)%SCRIPT[moment].length;startStep()}
function stepScript(dt){const s=SCRIPT[moment][si];stT+=dt;
if(waitS){const w=waitS;if(!w.answered){barEl.style.width=Math.max(0,1-stT/w.t)*100+'%';if(w.pressed||stT>=w.t){w.answered=true;w.at=stT;const who=w.pressed?C.player:C.kids[w.kid];who.userData.raise=true;who.userData.talking=true;
capEl.innerHTML=`<b>${w.pressed?'You':'Classmate'}</b>${w.ans}`;barEl.style.width='0';handBtn.disabled=true;handBtn.style.opacity=0.35}}
else if(stT-w.at>2.2){allPeople().forEach(g=>{g.userData.raise=false;g.userData.talking=false});next()}return}
if(stT>=s.t)next()}
function setMoment(m){moment=m;si=0;const k=m==='knock';C.principal.visible=C.captain.visible=k;door.rotation.y=k?0:door.rotation.y;
document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));allPeople().forEach(g=>{g.userData.raise=false});startStep()}
function setView(v){if(v==='cast'||view==='cast'){camPos.set(...VIEWS[v].p);camLook.set(...VIEWS[v].l)}view=v;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));labelsEl.innerHTML='';
if(v==='cast')['Teacher','Principal','Captain','Classmate','Classmate','You, the cadet','Nova, co-pilot'].forEach(t=>{const d=document.createElement('div');d.className='nm';d.textContent=t;labelsEl.appendChild(d)})}
function press(){if(waitS&&!waitS.answered)waitS.pressed=true}
handBtn.onclick=press;document.addEventListener('keydown',e=>{if(e.code==='Space'&&waitS&&!waitS.answered){e.preventDefault();press()}});
function animChar(g,dt){const u=g.userData;if(u.nova){g.position.y=1.3+Math.sin(T*2)*0.08;u.ring.rotation.z+=dt*1.5;g.rotation.y=Math.sin(T*0.7)*0.4;return}
u.torso.scale.y=1+Math.sin(T*2.2+u.ph)*0.015;u.blink-=dt;let ey=1;if(u.blink<0){ey=0.12;if(u.blink<-0.12)u.blink=2+rnd()*3}u.eyes.forEach(e=>e.scale.y=ey);
u.mouth.scale.y=u.talking?0.5+Math.abs(Math.sin(T*13+u.ph))*1.6:1;
let yaw=0;if(u.look){const w=headPos(g);const d=Math.atan2(u.look.x-w.x,u.look.z-w.z)-g.rotation.y;yaw=Math.max(-1.1,Math.min(1.1,Math.atan2(Math.sin(d),Math.cos(d))))}
u.head.rotation.y+=(yaw-u.head.rotation.y)*Math.min(1,dt*5);u.head.rotation.z=Math.sin(T*1.3+u.ph)*0.04+(u.talking?Math.sin(T*6)*0.035:0);
u.r+=((u.raise?1:0)-u.r)*Math.min(1,dt*8);const a=u.arms[1];a.rotation.z=0.12+(Math.PI*0.9-0.12)*u.r+(u.raise?Math.sin(T*9)*0.06:0);a.rotation.x=u.baseArmX*(1-u.r);u.arms[0].rotation.x=u.baseArmX}
const tmpV=new THREE.Vector3(),clk=new THREE.Clock();
function update(dt){T+=dt;stepScript(dt);const M=MOM[moment],cast=view==='cast';
const lerp=(a,b,k)=>a+(b-a)*Math.min(1,dt*k);
grade.uniforms.sat.value=lerp(grade.uniforms.sat.value,cast?1.0:M.sat,3);const tn=grade.uniforms.tint.value;tn.set(lerp(tn.x,cast?1:M.tint[0],3),lerp(tn.y,cast?1:M.tint[1],3),lerp(tn.z,cast?1:M.tint[2],3));
renderer.toneMappingExposure=lerp(renderer.toneMappingExposure,cast?1.05:M.exp,3);
hallM.emissiveIntensity=lerp(hallM.emissiveIntensity,M.hall,2.5);spot.intensity=lerp(spot.intensity,cast?0:M.spot*(door.rotation.y<-0.3?1:0.05),2.5);paneM.emissiveIntensity=M.win;fill.intensity=lerp(fill.intensity,!cast&&moment==='knock'?9:0,3);
studioKey.intensity=lerp(studioKey.intensity,cast?2.6:0,4);key.intensity=lerp(key.intensity,cast?0.6:1.8,4);
if(moment==='tuesday'&&!cast){if(flick<=0&&rnd()<0.006)flick=0.35;}if(flick>0){flick-=dt;const on=rnd()>0.5;tubeM.emissiveIntensity=on?2.2:0.3;tube.intensity=on?22:4}else{tubeM.emissiveIntensity=2.2;tube.intensity=22}
door.rotation.y+=(doorTarget-door.rotation.y)*Math.min(1,dt*3);
minH.rotation.z=-T*0.2;hourH.rotation.z=-T*0.017;
dust.position.y=Math.sin(T*0.25)*0.12;dust.rotation.y=T*0.012;
[...allPeople(),...C.cast].forEach(g=>animChar(g,dt));C.cast.forEach((g,i)=>{if(!g.userData.nova)g.rotation.y=Math.sin(T*0.5+i)*0.45});
const V=VIEWS[view];camPos.lerp(tmpV.set(...V.p),Math.min(1,dt*2.5));camLook.lerp(tmpV.set(...V.l),Math.min(1,dt*2.5));
camera.position.set(camPos.x+Math.sin(T*0.3)*0.05,camPos.y+Math.sin(T*0.45)*0.03,camPos.z);camera.lookAt(camLook);
capEl.style.display=cast?'none':'';
if(cast){const w=wrap.clientWidth,h=wrap.clientHeight;[...labelsEl.children].forEach((d,i)=>{const g=C.cast[i];tmpV.set(g.position.x,(g.userData.top||2)+0.12,g.position.z).project(camera);d.style.left=((tmpV.x+1)/2*w)+'px';d.style.top=((1-tmpV.y)/2*h)+'px'})}}
function tick(){update(Math.min(clk.getDelta(),0.05));composer.render();requestAnimationFrame(tick)}
const mk=(el,list,attr,fn)=>list.forEach(([k,n,d])=>{const b=document.createElement('button');b.className='sb';b.dataset[attr]=k;b.innerHTML=d?`${n}<small>${d}</small>`:n;b.onclick=()=>fn(k);$(el).appendChild(b)});
mk('styles',Object.entries(CS).map(([k,v])=>[k,v.label,v.sub]),'s',build);
mk('moments',[['tuesday','Sleepy Tuesday'],['knock','The knock']],'m',m=>{setMoment(m);setView(m==='knock'?'door':'back')});
mk('views',[['back','Back of class'],['teacher',"Teacher's view"],['door','The door'],['cast','Cast lineup']],'v',setView);
build('bean');setView('back');tick();
window.__step=sec=>{for(let i=0;i<sec*60;i++)update(1/60);composer.render()};window.__api={build,setMoment,setView,press};
</script>
